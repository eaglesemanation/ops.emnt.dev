apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cron-workflow.k8s.yaml
  - workflow-template.k8s.yaml
configMapGenerator:
  - name: trivy-scan-config
    namespace: argo-workflows
    files:
      - render.sh
      - scan.sh
      - trivy.yaml
      - trivyignore.yaml
generatorOptions:
  disableNameSuffixHash: true

