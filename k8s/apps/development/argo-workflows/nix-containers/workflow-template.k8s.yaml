# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nix-containers
  namespace: argo-workflows
spec:
  entrypoint: dag
  serviceAccountName: argo-workflows
  arguments:
    parameters:
      - name: repo
        description: Git URL of the flake repository to build images from.
        value: https://forgejo.${CLUSTER_DOMAIN}/public/ops.${CLUSTER_DOMAIN}.git
      - name: ref
        description: Branch or tag of `repo` to build images from.
        value: main
      - name: attrSuffix
        description: >-
          Suffix of the flake packages that produce an OCI image. The image is
          pushed as the kebab-case of the attribute name without this suffix,
          so `nixosBuildDockerImage` becomes `nixos-build`.
        value: DockerImage
  # Retries are per template on purpose. A retryStrategy at this level also
  # wraps the entrypoint `dag`, so a single failing image would restart the
  # whole DAG instead of just that image.
  podSpecPatch: |
    restartPolicy: Never
  templates:
    # Containers are discovered from the flake, so adding an image only means
    # adding a `packages.<name>DockerImage` package under `nix/containers/`;
    # no change to this workflow is needed. `nix2containerDockerImage` is
    # discovered too, but the pod image used here still has to be bootstrapped
    # (built and pushed) out of band the very first time, and whenever it gains
    # tools the scripts below start depending on; run `build` as the entrypoint
    # with `attr=nix2containerDockerImage` for that.
    #
    # Images whose derivation output is already published are filtered out in
    # `discover`, so a run with nothing to do builds nothing.
    - name: dag
      dag:
        # Wait for every image build instead of failing as soon as the first
        # one does. The DAG phase is what decides success, and letting the
        # successful builds finish keeps their `:<revision>` tags around so a
        # later attempt skips them.
        failFast: false
        tasks:
          - name: discover
            template: discover
          # Builds everything the remaining images depend on, but not the
          # images themselves, and publishes it to attic. The images share
          # most of their toolchain, so building it once here keeps the
          # parallel `build` tasks from repeating that work in every pod.
          # Failure is tolerated: `build` then falls back to doing the work
          # itself, which is what every run did before this step existed.
          - name: warm
            template: warm
            dependencies:
              - discover
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: attrs
                  value: "{{tasks.discover.outputs.parameters.attrs}}"
          # Expands into one parallel `build` task per changed image. An empty
          # list leaves the task group in the `Skipped` phase.
          - name: build
            template: build
            dependencies:
              - discover
              - warm
            withParam: "{{tasks.discover.outputs.parameters.containers}}"
            arguments:
              parameters:
                - name: attr
                  value: "{{item.attr}}"
                - name: container
                  value: "{{item.container}}"
                - name: revision
                  value: "{{item.revision}}"

    - name: discover
      retryStrategy: &retry
        limit: 2
        retryPolicy: Always
        backoff:
          duration: 30s
          factor: 2
      outputs:
        parameters:
          - name: containers
            valueFrom:
              path: /tmp/containers.json
          - name: attrs
            description: >-
              Flake package attributes of the images that still need building.
            valueFrom:
              path: /tmp/attrs.txt
      script:
        image: forgejo.${CLUSTER_DOMAIN}/public/nix2container:latest
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        securityContext:
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          runAsUser: 0
          allowPrivilegeEscalation: true
          # Argo's mainContainer defaults drop all capabilities and nix touches
          # store permissions when adding paths, so keep this privileged for now.
          privileged: true
        command: [bash]
        source: |
          #!/bin/bash
          # Flux postBuild substitution (k8s/flux/apps.k8s.yaml) rewrites every
          # brace expression in this file, so shell expansions are written as
          # $${...} and are unescaped by envsubst at apply time. Plain $var
          # references are left untouched.
          set -euo pipefail

          flake="git+{{workflow.parameters.repo}}?ref={{workflow.parameters.ref}}"
          suffix="{{workflow.parameters.attrSuffix}}"
          registry="forgejo.${CLUSTER_DOMAIN}/public"
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"

          # Emit `<attr> <outPath>` for every image package. Derivations are
          # pure, so the output path is a function of the flake lock plus the
          # package definition: it identifies the image without building it.
          packages="$(
            nix eval --raw "$flake#packages.$system" --apply '
              packages:
              let
                suffix = "'"$suffix"'";
                hasSuffix = name: s:
                  let
                    n = builtins.stringLength name;
                    m = builtins.stringLength s;
                  in n >= m && builtins.substring (n - m) m name == s;
                describe = name: name + " " + (builtins.getAttr name packages).outPath;
              in
                builtins.concatStringsSep "\n" (
                  map describe (builtins.filter (name: hasSuffix name suffix) (builtins.attrNames packages))
                )
            '
          )"

          if [[ -z "$packages" ]]; then
            echo "no '*$suffix' packages found in $flake#packages.$system" >&2
            exit 1
          fi

          # `nixosBuild` -> `nixos-build`
          kebab-case() {
            printf '%s' "$1" | sed -E 's/([A-Z])/-\l\1/g'
          }

          : > /tmp/containers.jsonl
          skipped=()
          attrs=()
          while read -r attr out_path; do
            [[ -n "$attr" ]] || continue
            container="$(kebab-case "$${attr%"$suffix"}")"
            # /nix/store/<hash>-<name> -> <hash>. `build` pushes this hash as
            # an extra tag, so its presence means this exact derivation output
            # was already published and the build can be skipped.
            store_name="$${out_path##*/}"
            revision="$${store_name%%-*}"

            if skopeo inspect --authfile /tmp/authfile.json \
              "docker://$registry/$container:$revision" >/dev/null 2>&1; then
              skipped+=("$container")
              continue
            fi

            attrs+=("$attr")
            jq -cn --arg attr "$attr" --arg container "$container" --arg revision "$revision" \
              '{attr: $attr, container: $container, revision: $revision}' >> /tmp/containers.jsonl
          done <<< "$packages"

          if [[ "$${#skipped[@]}" -gt 0 ]]; then
            echo "already published, skipping: $${skipped[*]}" >&2
          fi

          # Slurping the per-item objects gives the JSON list `withParam`
          # expects, and `[]` when every image was already published.
          jq -s . /tmp/containers.jsonl > /tmp/containers.json
          if [[ "$${#attrs[@]}" -gt 0 ]]; then
            printf '%s\n' "$${attrs[@]}" > /tmp/attrs.txt
          else
            : > /tmp/attrs.txt
          fi
        volumeMounts:
          - name: authfile
            mountPath: /tmp/authfile.json
            subPath: authfile.json
      volumes:
        - name: authfile
          secret:
            secretName: nix-containers-authfile

    - name: warm
      retryStrategy: *retry
      inputs:
        parameters:
          - name: attrs
            description: >-
              Flake package attributes chosen by `discover`. One per line.
      script:
        image: forgejo.${CLUSTER_DOMAIN}/public/nix2container:latest
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        securityContext:
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          runAsUser: 0
          allowPrivilegeEscalation: true
          privileged: true
        command: [bash]
        source: |
          #!/bin/bash
          # See the note in the discover template: $${...} is unescaped by Flux
          # postBuild substitution, plain $var is not touched.
          set -euo pipefail

          flake="git+{{workflow.parameters.repo}}?ref={{workflow.parameters.ref}}"

          attrs=()
          while read -r attr; do
            [[ -n "$attr" ]] && attrs+=("$attr")
          done <<< "{{inputs.parameters.attrs}}"

          if [[ "$${#attrs[@]}" -eq 0 ]]; then
            echo "nothing to warm, every image is already published" >&2
            exit 0
          fi

          attic login --set-default default https://attic.${CLUSTER_DOMAIN} $ATTIC_TOKEN
          attic use default

          # Instantiate the image derivations. This also writes the .drv files
          # that nix-store needs below; derivation paths are pure, so no build
          # happens yet.
          image_drvs=()
          for attr in "$${attrs[@]}"; do
            image_drvs+=("$(nix eval --raw "$flake#$attr.drvPath")")
          done

          # Every store path needed to build the images. `--include-outputs`
          # adds the outputs of input derivations, while an image's own output
          # is not part of its requisites, so the images themselves stay out.
          # This is the union across images, i.e. the shared build closure.
          nix-store --query --requisites --include-outputs "$${image_drvs[@]}" \
            | sort -u \
            | grep -v '\.drv$' \
            > /tmp/shared

          # Realise the closure rather than the images, then publish it. The
          # `build` tasks keep building the images; they just substitute the
          # shared parts from attic instead of rebuilding them per pod.
          xargs -r -n 64 nix-store --realise < /tmp/shared > /dev/null
          xargs -r -n 512 attic push default -j 2 < /tmp/shared || true
        env:
          - name: ATTIC_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: attic-creds

    - name: build
      retryStrategy: *retry
      inputs:
        parameters:
          - name: attr
            description: Flake package that produces the OCI image.
          - name: container
            description: >-
              Repository name to push to, under the Forgejo public org. Derived
              from `attr` when empty, so the template can be run on its own.
            value: ""
          - name: revision
            description: >-
              Nix store hash of the image derivation output, also pushed as an
              extra tag so later runs can tell this image is already published.
              Derived from `attr` when empty.
            value: ""
      script:
        image: forgejo.${CLUSTER_DOMAIN}/public/nix2container:latest
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        securityContext:
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          runAsUser: 0
          allowPrivilegeEscalation: true
          privileged: true
        command: [bash]
        source: |
          #!/bin/bash
          # See the note in the discover template: $${...} is unescaped by Flux
          # postBuild substitution, plain $var is not touched.
          set -eux

          # `nixosBuild` -> `nixos-build`
          kebab-case() {
            local s="$1" out="" c i
            for ((i = 0; i < $${#s}; i++)); do
              c="$${s:i:1}"
              if [[ "$c" == [[:upper:]] ]]; then
                out+="-$${c,,}"
              else
                out+="$c"
              fi
            done
            printf '%s' "$out"
          }

          flake="git+{{workflow.parameters.repo}}?ref={{workflow.parameters.ref}}"
          suffix="{{workflow.parameters.attrSuffix}}"
          attr="{{inputs.parameters.attr}}"
          container="{{inputs.parameters.container}}"
          revision="{{inputs.parameters.revision}}"

          # `discover` passes both, but when this template is used as a
          # standalone entry point they are derived from the flake here. Keep
          # this bash-only: it also runs against the currently published image
          # (to bootstrap a new one), which may predate tools like sed/grep.
          if [ -z "$container" ]; then
            container="$(kebab-case "$${attr%"$suffix"}")"
          fi
          if [ -z "$revision" ]; then
            out_path="$(nix eval --raw "$flake#$attr.outPath")"
            store_name="$${out_path##*/}"
            revision="$${store_name%%-*}"
          fi

          image="docker://forgejo.${CLUSTER_DOMAIN}/public/$container:latest"

          # The `:revision` tag is written last, so if it is already there this
          # image was published by an earlier attempt (or by a concurrent run)
          # and there is nothing left to do.
          if skopeo inspect --authfile /tmp/authfile.json \
            "docker://forgejo.${CLUSTER_DOMAIN}/public/$container:$revision" >/dev/null 2>&1; then
            echo "already published, skipping" >&2
            exit 0
          fi

          attic login --set-default default https://attic.${CLUSTER_DOMAIN} $ATTIC_TOKEN
          attic use default
          nix build "$flake#$attr"
          attic push default result -j 2 || true

          nix run "$flake#$attr.copyTo" -- \
            "$image" \
            --authfile /tmp/authfile.json

          # Same image, content-addressed tag. `:latest` is pushed first so a
          # failure here only causes a redundant rebuild next run, never a
          # stale `:latest`.
          nix run "$flake#$attr.copyTo" -- \
            "docker://forgejo.${CLUSTER_DOMAIN}/public/$container:$revision" \
            --authfile /tmp/authfile.json
        env:
          - name: ATTIC_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: attic-creds
        volumeMounts:
          - name: authfile
            mountPath: /tmp/authfile.json
            subPath: authfile.json
      volumes:
        - name: authfile
          secret:
            secretName: nix-containers-authfile
