# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nix-containers
  namespace: argo-workflows
spec:
  entrypoint: dag
  serviceAccountName: argo-workflows
  arguments:
    parameters:
      - name: repo
        description: Git URL of the flake repository to build images from.
        value: https://forgejo.${CLUSTER_DOMAIN}/public/ops.${CLUSTER_DOMAIN}.git
      - name: ref
        description: Branch or tag of `repo` to build images from.
        value: main
      - name: attrSuffix
        description: >-
          Suffix of the flake packages that produce an OCI image. The image is
          pushed as the kebab-case of the attribute name without this suffix,
          so `nixosBuildDockerImage` becomes `nixos-build`.
        value: DockerImage
  retryStrategy:
    limit: 2
    retryPolicy: Always
    backoff:
      duration: 30s
      factor: 2
  podSpecPatch: |
    restartPolicy: Never
  templates:
    # Containers are discovered from the flake, so adding an image only means
    # adding a `packages.<name>DockerImage` package under `nix/containers/`;
    # no change to this workflow is needed. `nix2containerDockerImage` is
    # discovered too, but the pod image used here still has to be bootstrapped
    # (built and pushed) out of band the very first time.
    #
    # Images whose derivation output is already published are filtered out in
    # `discover`, so a run with nothing to do builds nothing.
    - name: dag
      dag:
        tasks:
          - name: discover
            template: discover
          # Expands into one parallel `build` task per changed image. An empty
          # list leaves the task group in the `Skipped` phase.
          - name: build
            template: build
            dependencies:
              - discover
            withParam: "{{tasks.discover.outputs.parameters.containers}}"
            arguments:
              parameters:
                - name: attr
                  value: "{{item.attr}}"
                - name: container
                  value: "{{item.container}}"
                - name: revision
                  value: "{{item.revision}}"

    - name: discover
      outputs:
        parameters:
          - name: containers
            valueFrom:
              path: /tmp/containers.json
      script:
        image: forgejo.${CLUSTER_DOMAIN}/public/nix2container:latest
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        securityContext:
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          runAsUser: 0
          allowPrivilegeEscalation: true
          # Argo's mainContainer defaults drop all capabilities and nix touches
          # store permissions when adding paths, so keep this privileged for now.
          privileged: true
        command: [bash]
        source: |
          #!/bin/bash
          # Flux postBuild substitution (k8s/flux/apps.k8s.yaml) rewrites every
          # brace expression in this file, so shell expansions are written as
          # $${...} and are unescaped by envsubst at apply time. Plain $var
          # references are left untouched.
          set -euo pipefail

          flake="git+{{workflow.parameters.repo}}?ref={{workflow.parameters.ref}}"
          suffix="{{workflow.parameters.attrSuffix}}"
          registry="forgejo.${CLUSTER_DOMAIN}/public"
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"

          # Emit `<attr> <outPath>` for every image package. Derivations are
          # pure, so the output path is a function of the flake lock plus the
          # package definition: it identifies the image without building it.
          packages="$(
            nix eval --raw "$flake#packages.$system" --apply '
              packages:
              let
                suffix = "'"$suffix"'";
                hasSuffix = name: s:
                  let
                    n = builtins.stringLength name;
                    m = builtins.stringLength s;
                  in n >= m && builtins.substring (n - m) m name == s;
                describe = name: name + " " + (builtins.getAttr name packages).outPath;
              in
                builtins.concatStringsSep "\n" (
                  map describe (builtins.filter (name: hasSuffix name suffix) (builtins.attrNames packages))
                )
            '
          )"

          if [[ -z "$packages" ]]; then
            echo "no '*$suffix' packages found in $flake#packages.$system" >&2
            exit 1
          fi

          # `nixosBuild` -> `nixos-build`
          kebab-case() {
            local name="$1" out="" char i
            for ((i = 0; i < $${#name}; i++)); do
              char="$${name:i:1}"
              if [[ "$char" == [[:upper:]] ]]; then
                out+="-$${char,,}"
              else
                out+="$char"
              fi
            done
            printf '%s' "$out"
          }

          items=()
          skipped=()
          while read -r attr out_path; do
            [[ -n "$attr" ]] || continue
            container="$(kebab-case "$${attr%"$suffix"}")"
            # /nix/store/<hash>-<name> -> <hash>. `build` pushes this hash as
            # an extra tag, so its presence means this exact derivation output
            # was already published and the build can be skipped.
            store_name="$${out_path##*/}"
            revision="$${store_name%%-*}"

            if skopeo inspect --authfile /tmp/authfile.json \
              "docker://$registry/$container:$revision" >/dev/null 2>&1; then
              skipped+=("$container")
              continue
            fi

            items+=("{\"attr\":\"$attr\",\"container\":\"$container\",\"revision\":\"$revision\"}")
          done <<< "$packages"

          if [[ "$${#skipped[@]}" -gt 0 ]]; then
            echo "already published, skipping: $${skipped[*]}" >&2
          fi

          printf '[%s]\n' "$(IFS=,; printf '%s' "$${items[*]}")" > /tmp/containers.json
        volumeMounts:
          - name: authfile
            mountPath: /tmp/authfile.json
            subPath: authfile.json
      volumes:
        - name: authfile
          secret:
            secretName: nix-containers-authfile

    - name: build
      inputs:
        parameters:
          - name: attr
            description: Flake package that produces the OCI image.
          - name: container
            description: Repository name to push to, under the Forgejo public org.
          - name: revision
            description: >-
              Nix store hash of the image derivation output, also pushed as an
              extra tag so later runs can tell this image is already published.
      script:
        image: forgejo.${CLUSTER_DOMAIN}/public/nix2container:latest
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        securityContext:
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          runAsUser: 0
          allowPrivilegeEscalation: true
          privileged: true
        command: [sh]
        source: |
          #!/bin/sh
          # See the note in the discover template: $${...} is unescaped by Flux
          # postBuild substitution, plain $var is not touched.
          set -eux

          flake="git+{{workflow.parameters.repo}}?ref={{workflow.parameters.ref}}"
          attr="{{inputs.parameters.attr}}"
          image="docker://forgejo.${CLUSTER_DOMAIN}/public/{{inputs.parameters.container}}:latest"
          revision="{{inputs.parameters.revision}}"

          attic login --set-default default https://attic.${CLUSTER_DOMAIN} $ATTIC_TOKEN
          attic use default
          nix build "$flake#$attr"
          attic push default result -j 2 || true

          nix run "$flake#$attr.copyTo" -- \
            "$image" \
            --authfile /tmp/authfile.json

          # Same image, content-addressed tag. `:latest` is pushed first so a
          # failure here only causes a redundant rebuild next run, never a
          # stale `:latest`.
          nix run "$flake#$attr.copyTo" -- \
            "docker://forgejo.${CLUSTER_DOMAIN}/public/{{inputs.parameters.container}}:$revision" \
            --authfile /tmp/authfile.json
        env:
          - name: ATTIC_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: attic-creds
        volumeMounts:
          - name: authfile
            mountPath: /tmp/authfile.json
            subPath: authfile.json
      volumes:
        - name: authfile
          secret:
            secretName: nix-containers-authfile
