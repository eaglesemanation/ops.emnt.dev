# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: build-container
  namespace: argo-workflows
spec:
  entrypoint: build
  serviceAccountName: argo-workflows

  arguments:
    parameters:
      - name: container
      - name: revision

  retryStrategy:
    limit: 2
    retryPolicy: Always
    backoff:
      duration: 30s
      factor: 2

  podSpecPatch: |
    restartPolicy: Never

  templates:
    - name: build
      inputs:
        parameters:
          - name: container
            value: "{{workflow.parameters.container}}"
          - name: revision
            value: "{{workflow.parameters.revision}}"

      container:
        image: ghcr.io/osscontainertools/kaniko:latest
        command: ["/kaniko/executor"]
        securityContext:
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsNonRoot: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - SETUID
              - SETGID
              - FOWNER
              - DAC_OVERRIDE
        args:
          - "--context=git://forgejo.${CLUSTER_DOMAIN}/public/ops.${CLUSTER_DOMAIN}.git#refs/heads/main#{{inputs.parameters.revision}}"
          - "--context-sub-path=k8s/containers/{{inputs.parameters.container}}/"
          - "--dockerfile=Containerfile"
          - "--destination=forgejo.${CLUSTER_DOMAIN}/public/{{inputs.parameters.container}}:{{inputs.parameters.revision}}"
          - "--destination=forgejo.${CLUSTER_DOMAIN}/public/{{inputs.parameters.container}}:latest"

        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"

        volumeMounts:
          - name: docker-config
            mountPath: /kaniko/.docker/config.json
            subPath: config.json
            readOnly: true

      volumes:
        - name: docker-config
          secret:
            secretName: nix-containers-authfile
            items:
              - key: authfile.json
                path: config.json

