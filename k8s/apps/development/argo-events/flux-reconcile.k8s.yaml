apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: flux-reconcile-on-push
  namespace: argo-events
spec:
  eventBusName: bus
  dependencies:
    - name: forgejo-push
      eventSourceName: forgejo
      eventName: forgejo
      filters:
        data:
          - path: header.X-Forgejo-Event
            type: string
            value:
              - push
          - path: body.repository.full_name
            type: string
            value:
              - public/ops.${CLUSTER_DOMAIN}
          - path: body.ref
            type: string
            value:
              - refs/heads/main
          - path: "[body.commits.#.[added,removed,modified].@flatten].@flatten.@flatten"
            type: bool
            value:
              - "true"
            template: >-
              {{- $matched := false -}}
              {{- range .Input | fromJson -}}
                  {{- if or (regexMatch `^k8s/apps/` .) (regexMatch `^k8s/flux` .) -}}
                      {{- $matched = true -}}
                  {{- end -}}
              {{- end -}}
              {{- $matched -}}
  triggers:
    - template:
        name: patch-git-repository
        k8s:
          operation: patch
          patchType: merge
          source:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: GitRepository
              metadata:
                name: emnt-ops
                namespace: flux-system
          parameters:
            - src:
                dependencyName: push-event
                dataKey: body.head_commit.timestamp
              dest: metadata.annotations.reconcile\.fluxcd\.io/requestedAt
      retryStrategy:
        steps: 3
        duration: 5s
