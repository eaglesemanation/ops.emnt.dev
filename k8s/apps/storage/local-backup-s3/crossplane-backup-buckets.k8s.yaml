# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/apiextensions.crossplane.io/compositeresourcedefinition_v2.json
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: backupbuckets.crossplane.emnt.dev
spec:
  scope: Namespaced
  group: crossplane.emnt.dev
  names:
    kind: BackupBucket
    plural: backupbuckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mirrorSchedule:
                  type: string
                  default: "0 0 * * *"
                suspendMirrorJob:
                  type: boolean
                  default: false
            status:
              type: object
              properties: {}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/apiextensions.crossplane.io/composition_v1.json
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: backupbuckets.crossplane.emnt.dev
spec:
  compositeTypeRef:
    apiVersion: crossplane.emnt.dev/v1alpha1
    kind: BackupBucket
  mode: Pipeline
  pipeline:
    - functionRef:
        name: function-patch-and-transform
      step: patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: local-bucket
            base:
              apiVersion: bucket.garage.m.crossplane.io/v1alpha1
              kind: Bucket
              spec:
                forProvider: {}
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: garage
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: metadata.name
                type: FromCompositeFieldPath
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.globalAlias
                type: FromCompositeFieldPath
          - name: local-key
            base:
              apiVersion: key.garage.m.crossplane.io/v1alpha1
              kind: Key
              spec:
                forProvider: {}
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: garage
                writeConnectionSecretToRef:
                  name: local-backup-s3-key
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: metadata.name
                type: FromCompositeFieldPath
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.name
                type: FromCompositeFieldPath
          - name: local-permission
            base:
              apiVersion: bucket.garage.m.crossplane.io/v1alpha1
              kind: Permission
              spec:
                forProvider:
                  read: true
                  write: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: garage
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: metadata.name
                type: FromCompositeFieldPath
              # Key and Bucket are both named after the claim namespace (see patches above)
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.accessKeyIdRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.bucketIdRef.name
                type: FromCompositeFieldPath
          - name: b2-bucket
            base:
              apiVersion: b2.m.crossplane.io/v1alpha1
              kind: Bucket
              spec:
                forProvider:
                  bucketType: allPrivate
                  defaultServerSideEncryption:
                    - algorithm: AES256
                      mode: SSE-B2
                  lifecycleRules:
                    - fileNamePrefix: ""
                      daysFromHidingToDeleting: 30
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: b2
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: metadata.name
                type: FromCompositeFieldPath
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.bucketName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: emnt-dev-%s
                type: FromCompositeFieldPath
          - name: b2-application-key
            base:
              apiVersion: b2.m.crossplane.io/v1alpha1
              kind: ApplicationKey
              spec:
                forProvider:
                  bucketIdsSelector:
                    matchControllerRef: true
                  capabilities:
                    - listBuckets
                    - listFiles
                    - readFiles
                    - writeFiles
                    - deleteFiles
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: b2
                writeConnectionSecretToRef:
                  name: backblaze-b2-key
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: metadata.name
                type: FromCompositeFieldPath
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.keyName
                type: FromCompositeFieldPath
          - name: b2-replication-cronjob
            readinessChecks:
              - type: None
            base:
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: local-to-b2-backup-mirror
              spec:
                concurrencyPolicy: Forbid
                successfulJobsHistoryLimit: 3
                failedJobsHistoryLimit: 3
                jobTemplate:
                  spec:
                    template:
                      spec:
                        restartPolicy: OnFailure
                        containers:
                          - name: mc-mirror
                            image: forgejo.emnt.dev/public/mc:latest
                            command:
                              - /bin/sh
                              - -c
                              - |
                                set -e
                                mc alias set local http://garage.garage.svc.cluster.local $LOCAL_ACCESS_KEY $LOCAL_SECRET_KEY --api S3v4 --path on
                                mc alias set remote https://s3.us-east-005.backblazeb2.com $REMOTE_ACCESS_KEY $REMOTE_SECRET_KEY
                                mc mirror --remove --overwrite local/$BUCKET_NAME remote/emnt-dev-$BUCKET_NAME
                            env:
                              - name: BUCKET_NAME
                                value: ""
                              - name: LOCAL_ACCESS_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: local-backup-s3-key
                                    key: access_key_id
                              - name: LOCAL_SECRET_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: local-backup-s3-key
                                    key: secret_access_key
                              - name: REMOTE_ACCESS_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: backblaze-b2-key
                                    key: application_key_id
                              - name: REMOTE_SECRET_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: backblaze-b2-key
                                    key: application_key
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.jobTemplate.spec.template.spec.containers[0].env[0].value
                type: FromCompositeFieldPath
              - fromFieldPath: spec.mirrorSchedule
                toFieldPath: spec.schedule
                type: FromCompositeFieldPath
              - fromFieldPath: spec.suspendMirrorJob
                toFieldPath: spec.suspend
                type: FromCompositeFieldPath
          - name: b2-recovery-cronjob
            readinessChecks:
              - type: None
            base:
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: b2-to-local-recovery
              spec:
                concurrencyPolicy: Forbid
                suspend: true
                schedule: "0 0 31 2 *"
                successfulJobsHistoryLimit: 3
                failedJobsHistoryLimit: 3
                jobTemplate:
                  spec:
                    template:
                      spec:
                        restartPolicy: OnFailure
                        containers:
                          - name: mc-mirror
                            image: forgejo.emnt.dev/public/mc:latest
                            command:
                              - /bin/sh
                              - -c
                              - |
                                set -e
                                mc alias set local http://garage.garage.svc.cluster.local $LOCAL_ACCESS_KEY $LOCAL_SECRET_KEY --api S3v4 --path on
                                mc alias set remote https://s3.us-east-005.backblazeb2.com $REMOTE_ACCESS_KEY $REMOTE_SECRET_KEY

                                echo "WARNING: This job will overwrite local backups with remote ones, which are probably outdated."
                                echo "Make sure you know what you're doing. Sleeping for 2 minutes to give a chance to abort"
                                sleep 120
                                mc mirror --remove --overwrite remote/emnt-dev-$BUCKET_NAME local/$BUCKET_NAME
                            env:
                              - name: BUCKET_NAME
                                value: ""
                              - name: LOCAL_ACCESS_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: local-backup-s3-key
                                    key: access_key_id
                              - name: LOCAL_SECRET_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: local-backup-s3-key
                                    key: secret_access_key
                              - name: REMOTE_ACCESS_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: backblaze-b2-key
                                    key: application_key_id
                              - name: REMOTE_SECRET_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: backblaze-b2-key
                                    key: application_key
            patches:
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.jobTemplate.spec.template.spec.containers[0].env[0].value
                type: FromCompositeFieldPath
