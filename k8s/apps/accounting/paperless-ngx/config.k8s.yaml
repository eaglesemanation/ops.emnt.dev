apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
  namespace: paperless-ngx
data:
  PAPERLESS_URL: https://paperless-ngx.${CLUSTER_DOMAIN}
  PAPERLESS_TIME_ZONE: America/Toronto
  PAPERLESS_OCR_LANGUAGE: eng
  PAPERLESS_OCR_LANGUAGES: rus
  # Extra languages require pod to have root access
  USERMAP_UID: "0"
  USERMAP_GID: "0"
  PAPERLESS_REDIS: redis://valkey.paperless-ngx.svc.cluster.local:6379
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_TIKA_ENABLED: "1"
  PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg.paperless-ngx.svc.cluster.local:3000
  PAPERLESS_TIKA_ENDPOINT: http://tika.paperless-ngx.svc.cluster.local:9998
  PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
  PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
  PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"

