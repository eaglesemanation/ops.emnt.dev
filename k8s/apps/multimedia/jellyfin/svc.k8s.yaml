apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
    - name: service-discovery
      port: 1900
      targetPort: 1900
      protocol: UDP
    - name: client-discovery
      port: 7359
      targetPort: 7359
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-upscaler
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: ai-upscaler
    app.kubernetes.io/instance: ai-upscaler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-upscaler
    app.kubernetes.io/instance: ai-upscaler
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
