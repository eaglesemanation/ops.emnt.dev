apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/instance: prowlarr
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
      app.kubernetes.io/instance: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
        app.kubernetes.io/instance: prowlarr
    spec:
      securityContext:
        runAsNonRoot: false # FIXME: Linuxserver images require root for init
      initContainers:
        - name: config
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              cp /config-source/config.xml /config/config.xml
              chown 1000:1000 /config/config.xml
              chmod 600 /config/config.xml
          volumeMounts:
            - name: data
              mountPath: /config
            - name: config
              mountPath: /config-source
              readOnly: true
      containers:
        - name: prowlarr
          image: ghcr.io/linuxserver/prowlarr:2.6.5
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          ports:
            - name: http
              containerPort: 9696
          securityContext:
            readOnlyRootFilesystem: false # FIXME: Linuxserver images require writable root fs
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          volumeMounts:
            - name: data
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: config-prowlarr
        - name: config
          secret:
            secretName: config-prowlarr
